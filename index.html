<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>플르부아 ERP 데모</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{color-scheme:light}
html,body{background:#FFFFFF;color:#111111}

body{margin:0;background:#FFFFFF;color:#111111;font-family:"Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif}
a{color:#111111}a:hover{color:#555555}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:#3A3A3A;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.nav:hover{background:#F2F2F2}
.nav.on{background:#111111;color:#FFFFFF;font-weight:500}
.cnt{font-size:11px;padding:2px 7px;border-radius:999px;background:#EDEDED;color:#3A3A3A}
.nav.on .cnt{background:#3A3A3A;color:#FFFFFF}
.card{border:1px solid #E3E3E3;border-radius:12px;padding:18px 20px;background:#FFFFFF;min-width:0}
.lab{font-size:12px;color:#595959;letter-spacing:.02em}
.big{font-size:24px;font-weight:700;margin-top:10px;letter-spacing:-.01em}
.sub{font-size:12px;color:#595959;margin-top:6px;line-height:1.55}
.h2{font-size:15px;font-weight:700;margin:0 0 4px}
.h2s{font-size:12px;color:#595959;margin:0 0 14px}
.tbox{overflow-x:auto;border:1px solid #E3E3E3;border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:500;color:#595959;background:#FAFAFA;padding:10px 14px;border-bottom:1px solid #E3E3E3;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #F0F0F0;white-space:nowrap}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.b{font-weight:700}
.mute{color:#8A8A8A}
.neg{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid #CFCFCF;color:#3A3A3A;white-space:nowrap}
.tag.dark{background:#111111;border-color:#111111;color:#FFFFFF}
.ph{color:#6B6B6B;background:#F2F2F2;border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap}
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #F0F0F0}
.alert:last-child{border-bottom:0}
.dot{flex:0 0 8px;height:8px;border-radius:999px;background:#111111;margin-top:6px}
.dot.lo{background:#BDBDBD}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:8px;border-bottom:1px solid #E3E3E3}
.bar{flex:1 1 0;min-width:0;background:#D9D9D9;border-radius:3px 3px 0 0}
.bar.on{background:#111111}
.xl{display:flex;gap:4px;margin-top:6px}
.xl span{flex:1 1 0;min-width:0;text-align:center;font-size:10px;color:#8A8A8A;overflow:hidden}
.hb{height:10px;background:#111111;border-radius:3px}
.hbt{height:10px;background:#EDEDED;border-radius:3px;flex:1 1 auto;display:flex}
.seg{height:22px}
.wf{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #F0F0F0;font-size:13px}
.wf:last-child{border-bottom:0}
.range{width:100%;accent-color:#111111;height:28px}
.lgd{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#595959;margin-right:14px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px}

#app>div{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.range{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #111111;outline-offset:2px}
@media (max-width:640px){main{padding:20px 16px 48px!important}aside{max-width:none!important;border-right:0!important;border-bottom:1px solid #EDEDED}}
</style>
</head>
<body style="margin:0">
<div id="app"></div>
<template id="tpl">
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #FFFFFF">
  <aside style="flex: 1 1 200px; max-width: 240px; box-sizing: border-box; padding: 24px 14px; border-right: 1px solid #EDEDED; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 20px">
      <div style="width: 34px; height: 34px; border-radius: 8px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">P</div>
      <div>
        <div style="font-size: 14px; font-weight: 700">Pleuvoir</div>
        <div style="font-size: 11px; color: #595959">통합 대시보드 · ERP</div>
      </div>
    </div>
    <div class="lab" style="padding: 6px 12px 4px">대시보드</div>
    <template data-for="navA" data-as="n">
      <button class="{{n.cls}}" data-on-click="{{n.go}}"><span>{{n.label}}</span><template data-if="n.hasCnt"><span class="cnt">{{n.cnt}}</span></template></button>
    </template>
    <div class="lab" style="padding: 16px 12px 4px">ERP</div>
    <template data-for="navB" data-as="n">
      <button class="{{n.cls}}" data-on-click="{{n.go}}"><span>{{n.label}}</span><template data-if="n.hasCnt"><span class="cnt">{{n.cnt}}</span></template></button>
    </template>
    <div style="margin-top: auto; padding: 20px 12px 0; font-size: 11px; color: #595959; line-height: 1.6">데모 화면<br>실데이터: 카페24 주문 10/3–10/5 · 원가표 · 메타 광고 관리자(9/1–10/5)<br>예시: 재고 수량 · 발주 · 회색 [연동 후] 칸</div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 36px 64px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid #EDEDED; margin-bottom: 24px">
      <div>
        <div class="lab">{{crumb}}</div>
        <h1 style="margin: 6px 0 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em">{{title}}</h1>
        <div class="sub">{{desc}}</div>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <span class="tag">기준 2026.10.04 (토)</span>
        <span class="tag">부가세 별도</span>
        <span class="tag dark">데모</span>
      </div>
    </div>

    <template data-if="isHome">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
          <template data-for="homeKpi" data-as="k">
            <div class="card"><div class="lab">{{k.l}}</div><div class="big">{{k.v}}</div><div class="sub">{{k.s}}</div></div>
          </template>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px">
          <div class="card">
            <p class="h2">메타 일별 구매 · 9/1 – 9/25</p>
            <p class="h2s">9/17 시크릿 세트 도입 후 일 구매 4.5건 → 29.6건 · 구매당 비용 ₩36,553 → ₩6,331</p>
            <div class="bars"><template data-for="metaDays" data-as="d"><div class="{{d.cls}}" style="height: {{d.h}}" title="{{d.tip}}"></div></template></div>
            <div class="xl"><template data-for="metaDays" data-as="d"><span>{{d.x}}</span></template></div>
            <div style="margin-top: 12px"><span class="lgd"><span class="sw" style="background: #D9D9D9"></span>상시 운영</span><span class="lgd"><span class="sw" style="background: #111111"></span>시크릿 세트 도입 후</span></div>
          </div>
          <div class="card">
            <p class="h2">알림</p>
            <p class="h2s">조건을 넘으면 자동으로 뜨는 항목</p>
            <template data-for="alerts" data-as="a">
              <div class="alert"><span class="{{a.dot}}"></span><div style="min-width: 0"><div style="font-size: 14px; font-weight: 500">{{a.t}}</div><div class="sub">{{a.d}}</div></div></div>
            </template>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px">
          <div class="card">
            <p class="h2">채널별 매출 · 10/4</p>
            <p class="h2s">쿠팡 · 올리브영 연동 시 자동 집계</p>
            <template data-for="channels" data-as="c">
              <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F0F0F0; font-size: 14px"><span>{{c.n}}</span><span class="{{c.cls}}">{{c.v}}</span></div>
            </template>
          </div>
          <div class="card">
            <p class="h2">주문 구성 · 기간별</p>
            <p class="h2s">미끼만 산 주문이 줄고 본품 · 일반 동반 주문이 늘었는지</p>
            <template data-for="mix" data-as="m">
              <div style="padding: 8px 0">
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: #3A3A3A; margin-bottom: 6px"><span>{{m.p}}</span><span>{{m.n}}</span></div>
                <div style="display: flex; border-radius: 4px; overflow: hidden"><div class="seg" style="width: {{m.w1}}; background: #111111"></div><div class="seg" style="width: {{m.w2}}; background: #6B6B6B"></div><div class="seg" style="width: {{m.w3}}; background: #BDBDBD"></div></div>
              </div>
            </template>
            <div style="margin-top: 10px"><span class="lgd"><span class="sw" style="background: #111111"></span>미끼만</span><span class="lgd"><span class="sw" style="background: #6B6B6B"></span>미끼 + 시크릿 본품</span><span class="lgd"><span class="sw" style="background: #BDBDBD"></span>시크릿 본품 · 일반 포함</span></div>
          </div>
        </div>
        <div>
          <p class="h2">최근 3일 · 자사몰</p>
          <p class="h2s">공헌이익 = 매출(부가세 제외) − 원가 − PG 3.5% − 택배 · 포장 3,500원/주문</p>
          <div class="tbox"><table>
            <thead><tr><th>날짜</th><th class="num">주문</th><th class="num">매출(실결제)</th><th class="num">객단가</th><th class="num">공헌이익 · 광고 전</th><th class="num">주문당</th><th class="num">광고비</th><th>비고</th></tr></thead>
            <tbody><template data-for="days" data-as="r"><tr><td class="b">{{r.d}}</td><td class="num">{{r.o}}</td><td class="num">{{r.s}}</td><td class="num">{{r.a}}</td><td class="num">{{r.c}}</td><td class="num b">{{r.p}}</td><td class="num"><span class="ph">연동 후</span></td><td class="mute">{{r.note}}</td></tr></template></tbody>
          </table></div>
        </div>
      </div>
    </template>

    <template data-if="isAds">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
          <template data-for="adKpi" data-as="k">
            <div class="card"><div class="lab">{{k.l}}</div><div class="big">{{k.v}}</div><div class="sub">{{k.s}}</div></div>
          </template>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px">
          <div class="card">
            <p class="h2">시간대별 주문 · 10/4 (토)</p>
            <p class="h2s">0–11시 47건 · 12–20시 6건 · 21–23시 9건 → 광고 게재 · 결제 상태 확인 알림 대상</p>
            <div class="bars"><template data-for="hours" data-as="d"><div class="{{d.cls}}" style="height: {{d.h}}" title="{{d.tip}}"></div></template></div>
            <div class="xl"><template data-for="hours" data-as="d"><span>{{d.x}}</span></template></div>
          </div>
          <div class="card">
            <p class="h2">상품별 판매 수량 · 10/3 – 10/5</p>
            <p class="h2s">상위 10개 · 카페24 주문 품목 기준</p>
            <template data-for="rank" data-as="r">
              <div style="display: grid; grid-template-columns: 150px minmax(0, 1fr) 48px; align-items: center; gap: 10px; padding: 5px 0; font-size: 12px">
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.n}}</span>
                <div class="hbt"><div class="hb" style="width: {{r.w}}"></div></div>
                <span class="num b">{{r.q}}</span>
              </div>
            </template>
          </div>
        </div>
        <div>
          <p class="h2">광고 성과 · 광고 단위</p>
          <p class="h2s">메타 광고 관리자 최근 7일 · 10/5 17:10 수집 · 웹사이트 구매 기준</p>
          <div class="tbox"><table>
            <thead><tr><th>광고</th><th>랜딩</th><th class="num">지출</th><th class="num">구매 · 클릭</th><th class="num">구매당 비용 · CPC</th><th class="num">ROAS</th><th>판단</th></tr></thead>
            <tbody><template data-for="ads" data-as="r"><tr><td class="b">{{r.n}}</td><td><span class="tag">{{r.l}}</span></td><td class="num">{{r.s}}</td><td class="num">{{r.p}}</td><td class="num b">{{r.c}}</td><td class="num">{{r.r}}</td><td><span class="{{r.jc}}">{{r.j}}</span></td></tr></template></tbody>
          </table></div>
        </div>
        <div>
          <p class="h2">기간 비교 · 메타 전체</p>
          <p class="h2s">지출이 늘어서가 아니라 배분이 바뀌어서 판 구간</p>
          <div class="tbox"><table>
            <thead><tr><th>구간</th><th class="num">지출 합계</th><th class="num">일 평균 지출</th><th class="num">구매</th><th class="num">일 평균 구매</th><th class="num">구매당 비용</th></tr></thead>
            <tbody><template data-for="periods" data-as="r"><tr><td class="b">{{r.k}}</td><td class="num">{{r.a}}</td><td class="num">{{r.b}}</td><td class="num">{{r.c}}</td><td class="num">{{r.d}}</td><td class="num b">{{r.e}}</td></tr></template></tbody>
          </table></div>
        </div>
      </div>
    </template>

    <template data-if="isPl">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px">
          <div class="card">
            <p class="h2">손익 흐름 · 10/4 자사몰</p>
            <p class="h2s">매출에서 광고 전 공헌이익까지, 광고비는 메타 연동 후 자동 차감</p>
            <template data-for="wf" data-as="w">
              <div class="wf"><span style="flex: 0 0 120px">{{w.n}}</span><div style="flex: 1 1 auto; display: flex"><div style="height: 12px; border-radius: 3px; width: {{w.w}}; background: {{w.c}}"></div></div><span class="num" style="flex: 0 0 110px; font-weight: {{w.fw}}">{{w.v}}</span></div>
            </template>
            <div class="sub" style="margin-top: 10px">광고비가 ₩286,445를 넘으면 그날은 적자 — 이 숫자가 매일 광고 예산 상한으로 표시됩니다.</div>
          </div>
          <div class="card">
            <p class="h2">손익 시뮬레이터</p>
            <p class="h2s">하루 매출 · 정상가 비중 · 광고비를 바꾸면 이익이 바로 계산됩니다</p>
            <div style="display: flex; flex-direction: column; gap: 14px">
              <div><label for="sim-rev" style="display: flex; justify-content: space-between; font-size: 13px"><span>하루 매출</span><span class="b">{{simRevL}}</span></label><input id="sim-rev" class="range" type="range" min="100" max="500" step="10" value="{{simRev}}" data-on-change="{{setRev}}"></div>
              <div><label for="sim-full" style="display: flex; justify-content: space-between; font-size: 13px"><span>정상가 매출 비중</span><span class="b">{{simFullL}}</span></label><input id="sim-full" class="range" type="range" min="0" max="100" step="5" value="{{simFull}}" data-on-change="{{setFull}}"></div>
              <div><label for="sim-ad" style="display: flex; justify-content: space-between; font-size: 13px"><span>하루 광고비</span><span class="b">{{simAdL}}</span></label><input id="sim-ad" class="range" type="range" min="0" max="200" step="5" value="{{simAd}}" data-on-change="{{setAd}}"></div>
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; padding-top: 16px; border-top: 1px solid #EDEDED">
              <template data-for="simOut" data-as="o">
                <div><div class="lab">{{o.l}}</div><div style="font-size: 18px; font-weight: 700; margin-top: 6px">{{o.v}}</div></div>
              </template>
            </div>
            <div class="sub" style="margin-top: 12px">가정: 객단가 정상가 4.5만 · 시크릿 2.8만, 원가율 정상가 22%(추정) · 시크릿 57%(실측), PG 3.5%, 택배 3,500원, 고정비 제외.</div>
          </div>
        </div>
        <div>
          <p class="h2">시크릿 미끼 상품별 주문당 공헌이익 · 10/3 – 10/5</p>
          <p class="h2s">밑줄 = 적자 · 상위 3개(EDP50 · 버디 · 디스커버리)가 미끼 판매의 69%</p>
          <div class="tbox"><table>
            <thead><tr><th>상품</th><th class="num">시크릿가</th><th class="num">원가</th><th class="num">마진율</th><th class="num">단독 구매(배송비 3천)</th><th class="num">본품과 함께(택배 공유)</th><th class="num">3일 판매</th><th>제안</th></tr></thead>
            <tbody><template data-for="bait" data-as="r"><tr><td class="b">{{r.n}}</td><td class="num">{{r.p}}</td><td class="num">{{r.c}}</td><td class="num">{{r.m}}</td><td class="{{r.sc}}">{{r.s}}</td><td class="{{r.ac}}">{{r.a}}</td><td class="num">{{r.q}}</td><td><span class="{{r.tc}}">{{r.t}}</span></td></tr></template></tbody>
          </table></div>
        </div>
      </div>
    </template>

    <template data-if="isCrm">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
          <template data-for="crmKpi" data-as="k">
            <div class="card"><div class="lab">{{k.l}}</div><div class="big">{{k.v}}</div><div class="sub">{{k.s}}</div></div>
          </template>
        </div>
        <div>
          <p class="h2">자동 발송 시나리오</p>
          <p class="h2s">광고비 없이 만드는 매출 — 마케팅 수신 동의 고객 대상</p>
          <div class="tbox"><table>
            <thead><tr><th>시점</th><th>대상</th><th>메시지</th><th>채널</th><th class="num">발송</th><th class="num">구매 전환</th></tr></thead>
            <tbody><template data-for="flows" data-as="r"><tr><td class="b">{{r.t}}</td><td>{{r.a}}</td><td>{{r.m}}</td><td>{{r.c}}</td><td class="num"><span class="ph">측정 전</span></td><td class="num"><span class="ph">측정 전</span></td></tr></template></tbody>
          </table></div>
        </div>
      </div>
    </template>

    <template data-if="isLtv">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
          <template data-for="ltvKpi" data-as="k">
            <div class="card"><div class="lab">{{k.l}}</div><div class="big">{{k.v}}</div><div class="sub">{{k.s}}</div></div>
          </template>
        </div>
        <div>
          <p class="h2">고객 획득 비용(CAC) · 기간별</p>
